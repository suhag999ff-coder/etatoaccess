<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>FF PLAYER INFO · HACKER TERMINAL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            color: #00ffc3;
            font-family: 'Share Tech Mono', monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        /* Matrix Rain Background (Canvas) */
        #matrixCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.3;
            pointer-events: none;
        }
        /* Terminal Container */
        .terminal {
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 800px;
            max-height: 90vh;
            background: rgba(10, 10, 20, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid #00ffc355;
            border-radius: 18px;
            padding: 24px 28px;
            box-shadow: 0 0 60px rgba(0, 255, 195, 0.08), inset 0 0 30px rgba(0, 255, 195, 0.02);
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #00ffc3 transparent;
        }
        .terminal::-webkit-scrollbar {
            width: 4px;
        }
        .terminal::-webkit-scrollbar-thumb {
            background: #00ffc3;
            border-radius: 10px;
        }
        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #00ffc344;
            padding-bottom: 10px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }
        .header h1 {
            font-size: 1.6rem;
            letter-spacing: 2px;
            text-shadow: 0 0 20px #00ffc366;
        }
        .header .status {
            font-size: 0.7rem;
            color: #66ffaa;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .header .status .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #00ffc3;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.4; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0.4; transform: scale(0.8); }
        }
        /* Output / Console */
        .console {
            background: rgba(0, 0, 0, 0.6);
            border-radius: 12px;
            padding: 16px 18px;
            margin: 14px 0;
            min-height: 160px;
            max-height: 340px;
            overflow-y: auto;
            border: 1px solid #00ffc322;
            font-size: 0.95rem;
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .console .cursor {
            display: inline-block;
            width: 10px;
            height: 1.2em;
            background: #00ffc3;
            animation: blink 0.8s step-end infinite;
            vertical-align: text-bottom;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        /* Input area */
        .input-area {
            display: flex;
            gap: 12px;
            margin: 16px 0 8px;
            flex-wrap: wrap;
        }
        .input-area input {
            flex: 1;
            background: #0a0a0e;
            border: 1px solid #00ffc355;
            border-radius: 40px;
            padding: 12px 18px;
            color: #00ffc3;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.95rem;
            outline: none;
            transition: 0.3s;
            min-width: 180px;
        }
        .input-area input:focus {
            border-color: #00ffc3;
            box-shadow: 0 0 30px #00ffc322;
        }
        .input-area input::placeholder {
            color: #446;
        }
        .btn {
            background: linear-gradient(90deg, #00ffc3, #0099ff);
            border: none;
            border-radius: 40px;
            padding: 12px 28px;
            font-family: 'Share Tech Mono', monospace;
            font-weight: bold;
            font-size: 1rem;
            color: #000;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px #00ffc366;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        /* Player Info Card (hidden initially) */
        .player-card {
            display: none;
            margin-top: 20px;
            padding: 16px 18px;
            background: rgba(0, 20, 30, 0.5);
            border-radius: 14px;
            border: 1px solid #00ffc355;
            animation: fadeSlide 0.6s ease;
        }
        .player-card.visible {
            display: block;
        }
        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .player-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 16px;
            margin-top: 6px;
        }
        .player-item {
            display: flex;
            flex-direction: column;
            padding: 6px 0;
            border-bottom: 1px solid rgba(0,255,195,0.08);
        }
        .player-item .label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #88aacc;
        }
        .player-item .value {
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            word-break: break-word;
        }
        .player-item .value.highlight {
            color: #00ffc3;
        }
        .token-display {
            background: #0a0a0e;
            border-radius: 10px;
            padding: 10px 14px;
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            border: 1px solid #00ffc322;
            font-size: 0.8rem;
        }
        .token-display .token-text {
            word-break: break-all;
            flex: 1;
            min-width: 120px;
            color: #aaccdd;
            font-size: 0.75rem;
        }
        .token-actions button {
            background: transparent;
            border: 1px solid #00ffc355;
            color: #00ffc3;
            padding: 4px 12px;
            border-radius: 30px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.7rem;
            transition: 0.3s;
        }
        .token-actions button:hover {
            background: #00ffc322;
            border-color: #00ffc3;
        }
        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 0.65rem;
            color: #446;
            letter-spacing: 1px;
            border-top: 1px solid #00ffc322;
            padding-top: 14px;
        }
        .footer i {
            color: #00ffc3;
        }
        /* Scrollbar for console */
        .console::-webkit-scrollbar {
            width: 4px;
        }
        .console::-webkit-scrollbar-thumb {
            background: #00ffc3;
            border-radius: 10px;
        }
        /* Responsive */
        @media (max-width: 560px) {
            .terminal { padding: 16px; }
            .header h1 { font-size: 1.2rem; }
            .input-area { flex-direction: column; }
            .btn { width: 100%; justify-content: center; }
            .player-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- Matrix Rain Canvas -->
    <canvas id="matrixCanvas"></canvas>

    <!-- Terminal -->
    <div class="terminal">
        <div class="header">
            <h1><i class="fas fa-terminal"></i> FF PLAYER INFO</h1>
            <div class="status">
                <span class="dot"></span> SECURE CONNECTION
            </div>
        </div>

        <!-- Console Output -->
        <div class="console" id="console">
            <span id="consoleContent">> Initializing FF Player Info Terminal...<br>> Loading modules...<br>> Ready.</span>
            <span class="cursor"></span>
        </div>

        <!-- Input & Button -->
        <div class="input-area">
            <input type="text" id="inputField" placeholder="Paste EAT URL or Access Token..." autofocus>
            <button class="btn" id="executeBtn"><i class="fas fa-play"></i> EXECUTE</button>
        </div>

        <!-- Player Info Card -->
        <div class="player-card" id="playerCard">
            <div style="display:flex; align-items:center; gap:14px; margin-bottom:6px;">
                <div style="width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#00ffc3,#0099ff);display:flex;align-items:center;justify-content:center;font-size:24px;color:#000;box-shadow:0 0 30px #00ffc366;" id="playerAvatar"><i class="fas fa-user"></i></div>
                <div>
                    <div style="font-size:1.3rem;font-weight:700;" id="playerName">—</div>
                    <div style="font-size:0.7rem;color:#88aacc;">UID: <span id="playerUid">—</span></div>
                </div>
            </div>
            <div class="player-grid">
                <div class="player-item"><span class="label">🌍 Region</span><span class="value" id="playerRegion">N/A</span></div>
                <div class="player-item"><span class="label">📊 Level</span><span class="value" id="playerLevel">N/A</span></div>
                <div class="player-item"><span class="label">🏅 Rank</span><span class="value" id="playerRank">N/A</span></div>
                <div class="player-item"><span class="label">🎮 Status</span><span id="playerStatus">N/A</span></div>
            </div>
            <div class="token-display">
                <span class="token-text" id="tokenDisplay">••••••••••••••••</span>
                <div class="token-actions">
                    <button onclick="toggleToken()"><i class="fas fa-eye"></i> <span id="tokenToggleLabel">Show</span></button>
                    <button onclick="copyToken()"><i class="fas fa-copy"></i> Copy</button>
                </div>
            </div>
        </div>

        <div class="footer">
            <i class="fas fa-lock"></i> SECURE API CONNECTION &nbsp;·&nbsp; © NOYON OFFICIAL
        </div>
    </div>

    <script>
        // ============================================================
        // MATRIX RAIN
        // ============================================================
        (function matrixRain() {
            const canvas = document.getElementById('matrixCanvas');
            const ctx = canvas.getContext('2d');
            let w, h, cols, drops, fontSize = 14;
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+{}:<>?";

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
                cols = Math.floor(w / fontSize);
                drops = [];
                for (let i = 0; i < cols; i++) drops[i] = 1;
            }
            resize();
            window.addEventListener('resize', resize);

            function draw() {
                ctx.fillStyle = 'rgba(0,0,0,0.04)';
                ctx.fillRect(0, 0, w, h);
                ctx.fillStyle = '#00ffc3';
                ctx.font = fontSize + 'px monospace';
                for (let i = 0; i < drops.length; i++) {
                    const ch = chars[Math.floor(Math.random() * chars.length)];
                    const x = i * fontSize;
                    const y = drops[i] * fontSize;
                    ctx.globalAlpha = 0.3 + Math.random() * 0.4;
                    ctx.fillText(ch, x, y);
                    ctx.globalAlpha = 1;
                    if (y > h && Math.random() > 0.975) drops[i] = 0;
                    drops[i]++;
                }
                requestAnimationFrame(draw);
            }
            draw();
        })();

        // ============================================================
        // TYPING / CONSOLE LOGIC
        // ============================================================
        const consoleEl = document.getElementById('console');
        const consoleContent = document.getElementById('consoleContent');
        const inputField = document.getElementById('inputField');
        const executeBtn = document.getElementById('executeBtn');

        let isProcessing = false;
        let tokenVisible = false;
        let currentToken = '';

        // Typing effect
        function typeText(text, callback) {
            let index = 0;
            const chars = text.split('');
            consoleContent.textContent = '';
            const interval = setInterval(() => {
                if (index < chars.length) {
                    consoleContent.textContent += chars[index];
                    index++;
                    consoleEl.scrollTop = consoleEl.scrollHeight;
                } else {
                    clearInterval(interval);
                    if (callback) callback();
                }
            }, 25);
        }

        function appendToConsole(text, newLine = true) {
            if (newLine) {
                consoleContent.textContent += '\n> ' + text;
            } else {
                consoleContent.textContent += text;
            }
            consoleEl.scrollTop = consoleEl.scrollHeight;
        }

        function clearConsole() {
            consoleContent.textContent = '';
        }

        // ============================================================
        // PLAYER DATA (MOCK + dynamic)
        // ============================================================
        function generateMockPlayer(token) {
            // Use token to generate some deterministic but fake data
            const hash = token.length > 10 ? token.substring(0, 10) : token;
            const uid = '3881247319'; // example
            const names = ['—͞Ꮲᴇᴛ፝֟ᴀʟㅤꪇ༊', '⛩️𝕲𝖍𝖔𝖘𝖙', '𝓓𝓪𝓻𝓴_𝓚𝓷𝓲𝓰𝓱𝓽', '𝖭𝖾𝗑𝗎𝗌', '𝗥𝖊𝖆𝗉𝖊𝖗'];
            const name = names[parseInt(hash.charAt(0), 16) % names.length];
            const regions = ['BD', 'IN', 'SG', 'BR', 'US', 'EU'];
            const region = regions[parseInt(hash.charAt(1), 16) % regions.length];
            const level = 60 + (parseInt(hash.charAt(2), 16) % 40);
            const ranks = ['Bronze', 'Silver', 'Gold', 'Platinum', 'Diamond', 'Heroic', 'Grandmaster'];
            const rank = ranks[parseInt(hash.charAt(3), 16) % ranks.length];
            const statuses = ['Active', 'Inactive', 'Banned'];
            const status = statuses[parseInt(hash.charAt(4), 16) % statuses.length];
            return {
                name: name,
                uid: uid,
                region: region,
                level: level,
                rank: rank,
                status: status,
                avatar: null,
                access_token: token,
                token_status: 'Active',
                token_expiry: 'Session'
            };
        }

        // ============================================================
        // EXECUTE ACTION
        // ============================================================
        function execute() {
            if (isProcessing) return;
            const raw = inputField.value.trim();
            if (!raw) {
                appendToConsole('⚠️ Please paste an EAT URL or Access Token.', true);
                return;
            }

            // Extract token
            let token = raw;
            if (raw.startsWith('http://') || raw.startsWith('https://')) {
                const match = raw.match(/[?&](eat|access_token)=([^&]+)/);
                if (match) {
                    token = match[2];
                } else {
                    appendToConsole('❌ No eat= or access_token= found in URL.', true);
                    return;
                }
            }
            if (!token || token.length < 5) {
                appendToConsole('❌ Invalid token format.', true);
                return;
            }

            currentToken = token;

            // Simulate processing
            isProcessing = true;
            executeBtn.disabled = true;
            inputField.disabled = true;
            clearConsole();
            typeText('> 🔍 Scanning token...\n', () => {
                setTimeout(() => {
                    appendToConsole('> ✅ Token validated.', true);
                    setTimeout(() => {
                        appendToConsole('> 📡 Querying player database...', true);
                        setTimeout(() => {
                            // Generate mock player data
                            const player = generateMockPlayer(token);
                            displayPlayer(player);
                            appendToConsole('> ✅ Player found!', true);
                            isProcessing = false;
                            executeBtn.disabled = false;
                            inputField.disabled = false;
                            inputField.focus();
                        }, 800);
                    }, 600);
                }, 500);
            });
        }

        // ============================================================
        // DISPLAY PLAYER
        // ============================================================
        function displayPlayer(data) {
            const card = document.getElementById('playerCard');
            card.classList.add('visible');

            document.getElementById('playerName').textContent = data.name || 'Unknown';
            document.getElementById('playerUid').textContent = data.uid || '—';
            document.getElementById('playerRegion').textContent = data.region || 'N/A';
            document.getElementById('playerLevel').textContent = data.level || 'N/A';
            document.getElementById('playerRank').textContent = data.rank || 'N/A';

            const statusEl = document.getElementById('playerStatus');
            const status = data.status || 'unknown';
            let statusClass = 'status-unknown';
            let statusLabel = 'Unknown';
            if (status.toLowerCase() === 'active') {
                statusClass = 'status-active';
                statusLabel = 'Active';
            } else if (status.toLowerCase() === 'inactive') {
                statusClass = 'status-inactive';
                statusLabel = 'Inactive';
            } else if (status.toLowerCase() === 'banned') {
                statusClass = 'status-banned';
                statusLabel = 'Banned';
            } else {
                statusLabel = status.charAt(0).toUpperCase() + status.slice(1);
            }
            statusEl.innerHTML = `<span style="display:inline-block;padding:2px 14px;border-radius:30px;font-size:0.7rem;font-weight:700;text-transform:uppercase;background:${statusClass === 'status-active'?'rgba(0,255,195,0.18)':statusClass === 'status-inactive'?'rgba(255,85,85,0.15)':'rgba(255,255,255,0.06)'};color:${statusClass === 'status-active'?'#00ffc3':statusClass === 'status-inactive'?'#ff5555':'#888'};border:${statusClass === 'status-active'?'1px solid rgba(0,255,195,0.3)':statusClass === 'status-inactive'?'1px solid rgba(255,85,85,0.25)':'1px solid rgba(255,255,255,0.08)'}">${statusLabel}</span>`;

            // Avatar
            const avatar = document.getElementById('playerAvatar');
            if (data.avatar) {
                avatar.innerHTML = `<img src="${data.avatar}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
            } else {
                avatar.innerHTML = `<i class="fas fa-user"></i>`;
            }

            // Token
            document.getElementById('tokenDisplay').textContent = '••••••••••••••••';
            document.getElementById('tokenDisplay').style.color = '#88aacc';
            tokenVisible = false;
            document.getElementById('tokenToggleLabel').textContent = 'Show';
        }

        // ============================================================
        // TOKEN TOGGLE & COPY
        // ============================================================
        function toggleToken() {
            const el = document.getElementById('tokenDisplay');
            const label = document.getElementById('tokenToggleLabel');
            if (tokenVisible) {
                el.textContent = '••••••••••••••••';
                el.style.color = '#88aacc';
                label.textContent = 'Show';
                tokenVisible = false;
            } else {
                el.textContent = currentToken || 'No token';
                el.style.color = '#00ffc3';
                label.textContent = 'Hide';
                tokenVisible = true;
            }
        }

        function copyToken() {
            const text = currentToken || '';
            if (!text) {
                appendToConsole('⚠️ No token to copy.', true);
                return;
            }
            navigator.clipboard.writeText(text).then(() => {
                appendToConsole('✅ Token copied to clipboard!', true);
            }).catch(() => {
                // Fallback
                const el = document.getElementById('tokenDisplay');
                const range = document.createRange();
                range.selectNode(el);
                window.getSelection().removeAllRanges();
                window.getSelection().addRange(range);
                document.execCommand('copy');
                appendToConsole('✅ Token copied!', true);
            });
        }

        // ============================================================
        // EVENT LISTENERS
        // ============================================================
        executeBtn.addEventListener('click', execute);
        inputField.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                execute();
            }
        });

        // Auto-focus
        window.addEventListener('load', function() {
            inputField.focus();
            // Initial console message
            setTimeout(() => {
                appendToConsole('Type or paste an EAT URL / Access Token and press ENTER.', true);
            }, 500);
        });

        // ============================================================
        // STYLING for status badges (dynamic)
        // ============================================================
        // (already inline)
        console.log('🐉 FF Player Info · Hacker Terminal Ready');
    </script>
</body>
</html>
